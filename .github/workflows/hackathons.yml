name: refresh-hackathons
on:
  schedule:
    - cron: '0 7 * * *'      # daily
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: scrape devpost wins
        run: |
          set -euo pipefail
          mkdir -p assets/projects
          node .github/scripts/build-hackathons.mjs ICYBAWSS hackathons.json
      - name: commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add hackathons.json assets/projects
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -m "chore: refresh hackathon wins"
            git push
          fi
